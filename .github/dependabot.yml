version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Group only minor/patch dev updates. Majors arrive as individual PRs so a
      # single breaking bump can't make the whole group uninstallable.
      # See Docs/research/eslint10-ts7-upgrade-blockers.md.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
